#cloud-config
# Per-VM layer for a workshop VM (Ubuntu 26.04). Everything that is the same on
# every VM lives in setup/provision.sh, baked into the snapshot. This file only
# carries what differs per attendee.
#
# Substitute before use — one rendered file for every VM, see setup/README.md:
#   __VM_PASSWORD__         four random words, SHARED by every VM on purpose. It goes
#                           on the projector; the security group is what protects
#                           these boxes, not password uniqueness.
#
# No hostname here: Nectar sets it from the instance name, so launching 24 at once
# with a count gives ws-1 … ws-24 without rendering 24 files.
#
# No Claude credentials here. Each attendee signs in with /login using one of the
# workshop subscription accounts, handed out on their card — a baked-in
# CLAUDE_CODE_OAUTH_TOKEN would authenticate model requests but cannot establish a
# Remote Control session, and that is the 1:45 exercise.
#
# Never commit a rendered copy. Placeholders only in git.

timezone: Australia/Adelaide
locale: en_AU.UTF-8

# Password SSH, deliberately. Keys mean collecting thirty public keys beforehand
# or emailing thirty private ones, and neither survives contact with a room.
# This writes /etc/ssh/sshd_config.d/50-cloud-init.conf, which beats the image
# default of PasswordAuthentication no. Pair it with a source-IP restriction in
# the security group — see setup/README.md.
ssh_pwauth: true
chpasswd:
  expire: false            # no forced change at first login; there is no time
  users:
    - name: ubuntu
      password: __VM_PASSWORD__
      type: text

runcmd:
  # No-op on a snapshot that already ran provision.sh. On a bare Ubuntu image
  # this does the whole build at first boot — slower (several minutes, and every
  # VM pulls from apt and GitHub at once), but it needs no golden image.
  - |
    if ! command -v workshop-doctor >/dev/null; then
      bash -c "$(curl -fsSL https://raw.githubusercontent.com/SACGF/ai_agent_workshop/main/setup/provision.sh)"
    fi
  - touch /var/lib/cloud/workshop-ready

final_message: "Workshop VM ready after $UPTIME seconds. Log in as ubuntu."
