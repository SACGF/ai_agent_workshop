# Deliberately minimal. There is no test step yet -- growing this file is one of the
# workshop exercises. By the end of the day this should install mytools and run three
# things on every push and PR: the golden tests against bedtools, your unit tests, and
# a linter. See tests/README.md and issues/03-golden-tests-and-ci.md.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bedtools (the oracle)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bedtools
          bedtools --version

      - name: Run golden tests
        run: |
          # TODO: replace this with ./tests/run_golden.sh once it exists.
          # See tests/README.md for the pattern and a worked example.
          echo "no tests yet"
          exit 0
